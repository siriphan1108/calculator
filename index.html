<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="plate">MODEL <span>C&thinsp;&middot;&thinsp;100</span></div>

    <div class="screen-bezel">
        <div class="screen">
            <div class="screen-label">SOLAR</div>
            <div class="screen-ghost">88888888</div>
            <div class="screen-value" id="screen">0</div>
        </div>
    </div>

    <div class="keys">
        <button class="key span2" onclick="buttonClick('c')">C</button>
        <button class="key" onclick="buttonClick('back')">&larr;</button>
        <button class="key op" onclick="buttonClick('/')">&divide;</button>

        <button class="key" onclick="buttonClick('7')">7</button>
        <button class="key" onclick="buttonClick('8')">8</button>
        <button class="key" onclick="buttonClick('9')">9</button>
        <button class="key op" onclick="buttonClick('*')">&times;</button>

        <button class="key" onclick="buttonClick('4')">4</button>
        <button class="key" onclick="buttonClick('5')">5</button>
        <button class="key" onclick="buttonClick('6')">6</button>
        <button class="key op" onclick="buttonClick('-')">&minus;</button>

        <button class="key" onclick="buttonClick('1')">1</button>
        <button class="key" onclick="buttonClick('2')">2</button>
        <button class="key" onclick="buttonClick('3')">3</button>
        <button class="key op" onclick="buttonClick('+')">&plus;</button>

        <button class="key span2" onclick="buttonClick('0')">0</button>
        <button class="key" onclick="buttonClick('.')">.</button>
        <button class="key eq" onclick="buttonClick('=')">&equals;</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
